name: "OIDC Validation Bridge"
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-data-plane:
    runs-on: ubuntu-latest
    steps:
      - name: "Azure OIDC Login"
        uses: azure/login@v2
        with:
          client-id: "6634d368-0844-401d-9945-6b2c4dcfea1f"
          tenant-id: "9439dd25-f3b5-4829-a76f-5ede8cd54c3c"
          subscription-id: "d5ffd8a5-d994-4eb5-b87c-4442054d233e"

      - name: "Read Data-Plane Secret"
        run: |
          set +e 
          for i in {1..10}; do
            echo "Attempt $i: Querying Key Vault..."
            az keyvault secret show --name "bridge-validation-secret" --vault-name "kv-efm-test-lab-04" --query "value" -o tsv
            
            EXIT_CODE=$?
            if [[ $EXIT_CODE -eq 0 ]]; then
              echo "Data-plane read successful. OIDC bridge verified."
              exit 0
            fi
            
            echo "Authorization not yet propagated. Sleeping 30 seconds..."
            sleep 30
          done
          exit 1
