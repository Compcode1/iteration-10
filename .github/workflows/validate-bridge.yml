name: "OIDC Validation Bridge"
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-data-plane:
    runs-on: ubuntu-latest
    steps:
      - name: "Azure OIDC Login"
        uses: azure/login@v2
        with:
          client-id: "6634d368-0844-401d-9945-6b2c4dcfea1f"
          tenant-id: "9439dd25-f3b5-4829-a76f-5ede8cd54c3c"
          subscription-id: "d5ffd8a5-d994-4eb5-b87c-4442054d233e"

      - name: "Read Data-Plane Secret"
        uses: azure/cli@v2.1.0
        with:
          azcliversion: 2.63.0
          inlineScript: |
            set +e 
            for i in {1..10}; do
              OUTPUT=$(az keyvault secret show --name "bridge-validation-secret" --vault-name "kv-efm-test-lab-04" --query "value" -o tsv 2>&1)
              EXIT_CODE=$?
              if [[ $EXIT_CODE -eq 0 ]]; then
                echo "::add-mask::$OUTPUT"
                echo "Data-plane read successful. OIDC bridge verified."
                exit 0
              fi
              sleep 30
            done
            exit 1
